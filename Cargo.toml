[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.7"
axum-extra = { version = "0.9.6", default-features = false, features = ["cookie"] }
cookie = { version = "0.18.2", default-features = false }
lapin = { version = "2", features = ["rustls"], default-features = false }
openidconnect = "4.0.1"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10.3"
thiserror = "2.0.20"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
testcontainers = "0.20"
rsa = "0.9.10"
rand = "0.8"
base64 = "0.22"
url = "2"
